<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>СТО Контроль — Майстер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f1f5f9; user-select: none; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Шапка -->
  <header class="glass-panel border-b border-slate-700/50 p-3 md:p-4 sticky top-0 z-40 flex flex-col md:flex-row justify-between items-center gap-3 shadow-lg">
    <div class="flex justify-between items-center w-full md:w-auto">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2-4H8L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2m2 0a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0M5 11l1.5-4.5h11L19 11"></path>
          </svg>
        </div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">СТО <span class="text-blue-500">ГІГАНТ</span></h1>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-blue-500/10 text-blue-400 border border-blue-500/20">🔧 Майстер</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
      <input type="text" id="searchInput" placeholder="Пошук авто або номеру..." class="w-full md:w-64 bg-slate-800 border border-slate-700 rounded-lg px-3 md:px-4 py-2 text-sm outline-none focus:border-blue-500 transition-colors">
      <div class="hidden md:flex items-center gap-3">
        <span class="px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-blue-500/10 text-blue-400 border border-blue-500/20">🔧 Майстер</span>
      </div>
    </div>
  </header>

  <!-- Головна панель -->
  <main class="flex-1 p-3 md:p-6 w-full max-w-4xl mx-auto flex flex-col gap-4 md:gap-6">
    <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 shadow-sm flex justify-between items-center">
      <div>
        <h2 class="text-base md:text-lg font-semibold">Мої авто в роботі</h2>
        <p class="text-xs md:text-sm text-slate-400">Натисніть на авто для перегляду та керування роботами</p>
      </div>
      <span id="cnt-work" class="bg-blue-950 text-blue-300 border border-blue-800/60 text-xs font-bold px-3 py-1 rounded-md">0</span>
    </div>

    <!-- Список авто (лише назви) -->
    <div class="flex flex-col rounded-2xl bg-blue-950/20 border border-blue-900/40 overflow-hidden min-h-[500px]">
      <div class="p-3 md:p-4 border-b border-blue-900/40 bg-blue-950/40 flex justify-between items-center">
        <h3 class="font-bold text-blue-400 flex items-center gap-2 text-sm md:text-base"><span class="text-lg md:text-xl">⚙️</span> В роботі</h3>
      </div>
      <div id="col-work" class="p-3 md:p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 overflow-y-auto flex-1 scroll-hide content-start"></div>
    </div>
  </main>

  <!-- Модальне вікно деталей авто -->
  <div id="modal-car-details" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-lg shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700">
        <h3 id="modal-car-title" class="text-lg font-bold text-slate-100"></h3>
        <button onclick="closeModal('modal-car-details')" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
      </div>

      <div id="modal-car-body" class="py-4 overflow-y-auto space-y-4 flex-1 scroll-hide"></div>

      <div class="pt-3 border-t border-slate-700 flex justify-between items-center gap-2">
        <button id="modal-btn-done" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition-colors flex items-center gap-1">
          ✅ Позначити як готово
        </button>
        <button onclick="closeModal('modal-car-details')" class="bg-slate-700 hover:bg-slate-600 py-2 px-4 rounded-xl text-sm">Закрити</button>
      </div>
    </div>
  </div>

  <!-- Універсальна Модалка для Вводу (рядок) -->
  <div id="modal-input" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-sm shadow-2xl">
      <h3 id="modal-input-title" class="text-base md:text-lg font-bold mb-4">Введіть дані</h3>
      <input id="modal-input-field" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none mb-6">
      <div class="flex gap-3">
        <button onclick="closeModal('modal-input')" class="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm">Скасувати</button>
        <button id="modal-input-btn" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-white text-sm">Зберегти</button>
      </div>
    </div>
  </div>

  <!-- Модалка підтвердження для готовності -->
  <div id="modal-confirm" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-sm shadow-2xl text-center">
      <div class="text-3xl mb-2">✅</div>
      <h3 class="text-base md:text-lg font-bold mb-2">Завершити роботу?</h3>
      <p id="modal-confirm-text" class="text-sm text-slate-400 mb-6">Автомобіль буде позначено як готовий.</p>
      <div class="flex gap-3">
        <button onclick="closeModal('modal-confirm')" class="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm">Скасувати</button>
        <button id="modal-confirm-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-medium text-white text-sm transition-colors">Підтвердити</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 left-5 md:left-auto bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 pointer-events-none">
    <span id="toast-icon">✅</span>
    <span id="toast-msg" class="text-sm font-medium">Збережено</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3_i3S6lVNYqQMTdp9_CZGqCG6tteQVNg",
      authDomain: "taller-gigante.firebaseapp.com",
      databaseURL: "https://taller-gigante-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "taller-gigante",
      storageBucket: "taller-gigante.firebasestorage.app",
      messagingSenderId: "780999138565",
      appId: "1:780999138565:web:9e68715ae7a4564c1fab6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ordersRef = ref(db, 'orders');

    let allOrders = {};
    let currentAction = null;
    let activeOrderId = null;

    function showToast(msg, icon = '✅') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    window.openModal = function(id) {
      const m = document.getElementById(id);
      m.classList.remove('hidden');
      setTimeout(() => m.classList.remove('opacity-0'), 10);
    }
    window.closeModal = function(id) {
      const m = document.getElementById(id);
      m.classList.add('opacity-0');
      setTimeout(() => m.classList.add('hidden'), 200);
    }

    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      allOrders = data ? data : {};
      render();
      if (activeOrderId && allOrders[activeOrderId]) {
        renderModalContent(activeOrderId);
      }
    });

    function render() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const colWork = document.getElementById('col-work');
      colWork.innerHTML = '';

      let count = 0;

      Object.entries(allOrders).forEach(([id, o]) => {
        if (o.status !== 'work') return;
        if (!o.car || !o.car.toLowerCase().includes(searchQuery)) return;

        count++;

        const completedWorks = (o.works || []).filter(w => w.done).length;
        const totalWorks = (o.works || []).length;

        const card = document.createElement('div');
        card.className = 'bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-blue-500/50 p-4 rounded-xl cursor-pointer transition-all flex justify-between items-center shadow-md group';
        
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xl">🚗</span>
            <div>
              <h4 class="font-bold text-slate-100 text-base group-hover:text-blue-400 transition-colors">${o.car}</h4>
              <p class="text-xs text-slate-400">${totalWorks > 0 ? `Виконано ${completedWorks} з ${totalWorks} робіт` : 'Роботи не вказані'}</p>
            </div>
          </div>
          <span class="text-slate-400 group-hover:text-blue-400 transition-colors">➔</span>
        `;

        card.addEventListener('click', () => {
          openCarModal(id);
        });

        colWork.appendChild(card);
      });

      document.getElementById('cnt-work').innerText = count;
      if (count === 0) {
        colWork.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12 text-sm">Немає авто в роботі.</div>`;
      }
    }

    function openCarModal(id) {
      activeOrderId = id;
      renderModalContent(id);
      openModal('modal-car-details');
    }

    function renderModalContent(id) {
      const o = allOrders[id];
      if (!o) return;

      document.getElementById('modal-car-title').innerText = o.car;

      const body = document.getElementById('modal-car-body');
      
      const worksHtml = (o.works || []).map((w, idx) => `
        <div class="flex items-center gap-2.5 bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/50">
          <input type="checkbox" id="modal-chk-${idx}" ${w.done ? 'checked' : ''} class="w-4 h-4 rounded accent-blue-600 cursor-pointer">
          <span class="${w.done ? 'text-slate-500 line-through' : 'text-slate-200'} text-sm leading-tight flex-1">${w.text}</span>
        </div>
      `).join('');

      const partsHtml = (o.parts || []).map((p) => {
        let statusBadge = p.status === 'issued' 
          ? '<span class="text-emerald-400 font-semibold">🟢 Видано</span>' 
          : p.status === 'ordered' 
          ? '<span class="text-amber-400 font-semibold">🟡 Замовлено</span>' 
          : '<span class="text-slate-400 font-semibold">⏳ Очікує</span>';

        return `
        <div class="flex items-center justify-between bg-slate-900/80 p-2.5 rounded-lg border border-slate-700/50 text-sm">
          <span class="text-slate-200">📦 ${p.text}</span>
          <span class="text-xs shrink-0 ml-2">${statusBadge}</span>
        </div>
      `}).join('');

      body.innerHTML = `
        ${o.complaints ? `
          <div class="text-sm text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 border-l-4 border-l-blue-500">
            <span class="font-bold text-slate-400 block text-xs mb-1">Скарги клієнта:</span>
            💬 ${o.complaints}
          </div>
        ` : ''}

        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <h5 class="text-xs font-bold uppercase tracking-wider text-slate-400">Перелік робіт</h5>
            <button id="modal-add-work" class="text-xs font-bold uppercase text-blue-400 hover:underline">+ Додати роботу</button>
          </div>
          ${worksHtml || '<div class="text-xs text-slate-500 py-1">Немає робіт</div>'}
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-700/50">
          <div class="flex justify-between items-center">
            <h5 class="text-xs font-bold uppercase tracking-wider text-slate-400">Запчастини</h5>
            <button id="modal-add-part" class="text-xs font-bold uppercase text-emerald-400 hover:underline">+ Замовити деталь</button>
          </div>
          ${partsHtml || '<div class="text-xs text-slate-500 py-1">Немає запчастин</div>'}
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-700/50">
          <h5 class="text-xs font-bold uppercase tracking-wider text-amber-400">Коментар майстра</h5>
          <textarea id="modal-master-comment" rows="2" placeholder="Напишіть коментар до авто..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 outline-none focus:border-amber-500 transition-colors">${o.masterComment || ''}</textarea>
          <button id="modal-save-comment" class="w-full bg-amber-600/20 border border-amber-600/40 hover:bg-amber-600/30 text-amber-300 text-xs font-bold py-2 rounded-lg transition-colors">Зберегти коментар</button>
        </div>
      `;

      // Чекбокси робіт
      (o.works || []).forEach((_, idx) => {
        document.getElementById(`modal-chk-${idx}`)?.addEventListener('change', (e) => {
          let updatedWorks = [...o.works];
          updatedWorks[idx].done = e.target.checked;
          update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => showToast('Роботу оновлено'));
        });
      });

      // Додавання робіт
      document.getElementById('modal-add-work')?.addEventListener('click', () => {
        promptInput('Додати роботу', 'Заміна масла...', v => {
          let updatedWorks = [...(o.works || []), { text: v, done: false }];
          update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => showToast('Роботу додано'));
        });
      });

      // Додавання деталей
      document.getElementById('modal-add-part')?.addEventListener('click', () => {
        promptInput('Замовити деталь', 'Фільтр салону', v => {
          let updatedParts = [...(o.parts || []), { text: v, status: 'none' }];
          update(ref(db, `orders/${id}`), { parts: updatedParts }).then(() => showToast('Деталь додано'));
        });
      });

      // Збереження коментаря майстра
      document.getElementById('modal-save-comment')?.addEventListener('click', () => {
        const val = document.getElementById('modal-master-comment').value.trim();
        update(ref(db, `orders/${id}`), { masterComment: val }).then(() => showToast('Коментар збережено'));
      });

      // Підтвердження готовності
      document.getElementById('modal-btn-done').onclick = () => {
        document.getElementById('modal-confirm-text').innerText = `Ви впевнені, що хочете позначити ${o.car} як готове?`;
        currentAction = () => {
          update(ref(db, `orders/${id}`), { status: 'done' }).then(() => {
            closeModal('modal-car-details');
            showToast('Авто позначено як готово');
          });
        };
        openModal('modal-confirm');
      };
    }

    function promptInput(title, placeholder, callback) {
      document.getElementById('modal-input-title').innerText = title;
      const input = document.getElementById('modal-input-field');
      input.value = '';
      input.placeholder = placeholder;
      currentAction = callback;
      openModal('modal-input');
      setTimeout(() => input.focus(), 100);
    }

    document.getElementById('modal-input-btn').addEventListener('click', () => {
      const val = document.getElementById('modal-input-field').value.trim();
      if (val && currentAction) { 
        currentAction(val); 
        closeModal('modal-input'); 
      }
    });

    document.getElementById('modal-confirm-btn').addEventListener('click', () => {
      if (currentAction) {
        currentAction();
        closeModal('modal-confirm');
      }
    });

    document.getElementById('searchInput').addEventListener('input', render);
  </script>
</body>
</html>
