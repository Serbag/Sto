<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>СТО Контроль — Керівник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f1f5f9; user-select: none; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

  <header class="glass-panel border-b border-slate-700/50 p-3 md:p-4 sticky top-0 z-40 flex flex-col md:flex-row justify-between items-center gap-3 shadow-lg shrink-0">
    <div class="flex justify-between items-center w-full md:w-auto">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2-4H8L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2m2 0a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0M5 11l1.5-4.5h11L19 11"></path>
          </svg>
        </div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">СТО <span class="text-blue-500">ГІГАНТ</span></h1>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <button onclick="openReportModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg font-medium text-xs flex items-center gap-1.5">
          📊 Звіт
        </button>
        <span class="px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Керівник</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
      <input type="text" id="searchInput" placeholder="Пошук авто або номеру..." class="w-full md:w-64 bg-slate-800 border border-slate-700 rounded-lg px-3 md:px-4 py-2 text-sm outline-none focus:border-blue-500 transition-colors">
      <div class="hidden md:flex items-center gap-3">
        <button onclick="openReportModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition-colors shadow-lg">
          📊 Звіт
        </button>
        <span class="px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">💻 Керівник</span>
      </div>
    </div>
  </header>

  <main class="flex-1 p-3 md:p-6 w-full max-w-screen-2xl mx-auto flex flex-col md:flex-row gap-4 md:gap-6 min-h-0 overflow-hidden">
    
    <aside class="w-full md:w-80 lg:w-96 flex flex-col rounded-2xl bg-slate-900/60 border border-slate-800 overflow-hidden shrink-0 h-full">
      
      <div class="p-3 border-b border-slate-800 bg-slate-900/90 flex flex-col gap-3 shrink-0">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Автомобілі</span>
          <button onclick="openModal('modal-new-order')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl font-medium shadow transition-all flex items-center gap-1.5 text-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Нове авто
          </button>
        </div>

        <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
          <button onclick="setFilter('diag')" id="filter-diag" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center bg-blue-600 text-white shadow" title="Черга">
            <span class="text-sm">🔍</span>
            <span class="text-[9px] font-bold leading-tight">Черга</span>
            <span id="cnt-diag" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('work')" id="filter-work" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="В роботі">
            <span class="text-sm">⚙️</span>
            <span class="text-[9px] font-bold leading-tight">В роботі</span>
            <span id="cnt-work" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('done')" id="filter-done" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="Готово">
            <span class="text-sm">✅</span>
            <span class="text-[9px] font-bold leading-tight">Готово</span>
            <span id="cnt-done" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('all')" id="filter-all" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="Усі авто">
            <span class="text-sm">🚘</span>
            <span class="text-[9px] font-bold leading-tight">Усі</span>
            <span id="cnt-all" class="text-[9px] opacity-80">0</span>
          </button>
        </div>
      </div>

      <div id="sidebar-car-list" class="p-3 pb-16 space-y-2.5 overflow-y-auto flex-1 scroll-hide"></div>
    </aside>

    <section class="hidden md:flex flex-1 flex-col rounded-2xl bg-slate-900/40 border border-slate-800 overflow-hidden h-full">
      <div id="desktop-detail-container" class="h-full flex flex-col relative">
        <div id="desktop-empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-500 p-8 text-center space-y-3">
          <div class="text-5xl opacity-40">🚗</div>
          <p class="text-sm">Оберіть автомобіль із списку ліворуч або відкрийте звіт.</p>
        </div>

        <div id="desktop-car-content" class="hidden h-full flex-col">
          <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
            <div id="desk-detail-car-header" class="flex items-center gap-2 cursor-pointer group" title="Натисніть, щоб змінити марку/номер">
              <h3 id="desk-detail-car-title" class="text-xl font-bold text-slate-100 group-hover:text-blue-400 transition-colors">🚗 ...</h3>
              <svg class="w-4 h-4 text-slate-500 group-hover:text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            </div>
            
            <div class="flex items-center gap-3">
              <span class="text-xs text-slate-400">Статус:</span>
              <select id="desk-detail-status-sel" class="bg-slate-800 border border-slate-700 rounded-lg text-xs font-semibold p-2 text-slate-200 outline-none focus:border-blue-500">
                <option value="diag">🔍 Черга</option>
                <option value="work">⚙️ В роботі</option>
                <option value="done">✅ Готово</option>
              </select>
            </div>
          </div>
          <div class="p-6 overflow-y-auto space-y-5 scroll-hide flex-1" id="desk-detail-car-body"></div>
        </div>

        <div id="desktop-report-content" class="hidden h-full flex-col">
          <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
            <h3 class="text-xl font-bold text-slate-100 flex items-center gap-2">📊 Загальний звіт СТО</h3>
            <div class="flex gap-2">
              <button onclick="switchReportTab('parts')" id="desk-report-tab-parts" class="py-1.5 px-3 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow">📦 Запчастини</button>
              <button onclick="switchReportTab('works')" id="desk-report-tab-works" class="py-1.5 px-3 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800">🛠️ Роботи</button>
            </div>
          </div>
          <div class="p-6 overflow-y-auto space-y-4 scroll-hide flex-1" id="desk-report-body"></div>
        </div>
      </div>
    </section>

  </main>

  <div id="modal-car-details" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 md:hidden opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <div id="detail-car-header" class="flex items-center gap-2 cursor-pointer group">
          <h3 id="detail-car-title" class="text-lg font-bold text-slate-100 group-hover:text-blue-400 transition-colors">🚗 ...</h3>
          <svg class="w-4 h-4 text-slate-500 group-hover:text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </div>
        <button onclick="closeModal('modal-car-details')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 scroll-hide flex-1" id="detail-car-body"></div>

      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-between items-center">
        <select id="detail-status-sel" class="bg-slate-900 border border-slate-600 rounded-lg text-xs font-medium p-2 text-slate-200 outline-none focus:border-blue-500">
          <option value="diag">Черга</option>
          <option value="work">В роботі</option>
          <option value="done">Готово</option>
        </select>
        <button onclick="closeModal('modal-car-details')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <div id="modal-report" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 md:hidden opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-3xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <h3 class="text-lg font-bold flex items-center gap-2">📊 Загальний звіт СТО</h3>
        <button onclick="closeModal('modal-report')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="flex border-b border-slate-700 bg-slate-900/30 p-2 gap-2">
        <button onclick="switchReportTab('parts')" id="report-tab-parts" class="flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow">
          📦 Запчастини
        </button>
        <button onclick="switchReportTab('works')" id="report-tab-works" class="flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800/50">
          🛠️ Роботи
        </button>
      </div>

      <div class="p-4 flex-1 overflow-y-auto scroll-hide space-y-3" id="report-content"></div>

      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-end">
        <button onclick="closeModal('modal-report')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <div id="modal-new-order" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform">
      <h3 class="text-lg md:text-xl font-bold mb-4">🚗 Прийом авто</h3>
      <div class="space-y-4">
        <div>
          <label class="text-xs md:text-sm text-slate-400 block mb-1.5">Авто та номер</label>
          <input id="in-car" type="text" placeholder="Напр. BMW X5 (AX 7777 AI)" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="text-xs md:text-sm text-slate-400 block mb-1.5">Скарги / Причина звернення</label>
          <textarea id="in-complaints" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none resize-none"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeModal('modal-new-order')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-medium text-sm">Скасувати</button>
        <button onclick="saveNewOrder()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-medium shadow-lg text-sm">Створити</button>
      </div>
    </div>
  </div>

  <div id="modal-input" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-sm shadow-2xl">
      <h3 id="modal-input-title" class="text-base md:text-lg font-bold mb-4">Введіть дані</h3>
      <input id="modal-input-field" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none mb-6">
      <div class="flex gap-3">
        <button onclick="closeModal('modal-input')" class="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm">Скасувати</button>
        <button id="modal-input-btn" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-white text-sm">Зберегти</button>
      </div>
    </div>
  </div>

  <div id="modal-textarea" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-md shadow-2xl">
      <h3 id="modal-textarea-title" class="text-base md:text-lg font-bold mb-4">Редагувати скаргу</h3>
      <textarea id="modal-textarea-field" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none resize-none mb-6"></textarea>
      <div class="flex gap-3">
        <button onclick="closeModal('modal-textarea')" class="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm">Скасувати</button>
        <button id="modal-textarea-btn" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-white text-sm">Зберегти</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 left-5 md:left-auto bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 pointer-events-none">
    <span id="toast-icon">✅</span>
    <span id="toast-msg" class="text-sm font-medium">Збережено</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3_i3S6lVNYqQMTdp9_CZGqCG6tteQVNg",
      authDomain: "taller-gigante.firebaseapp.com",
      databaseURL: "https://taller-gigante-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "taller-gigante",
      storageBucket: "taller-gigante.firebasestorage.app",
      messagingSenderId: "780999138565",
      appId: "1:780999138565:web:9e68715ae7a4564c1fab6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ordersRef = ref(db, 'orders');

    let allOrders = {};
    let currentAction = null;
    let currentTextareaAction = null;
    let currentFilter = 'diag'; 
    let currentReportTab = 'parts';
    let activeCarId = null;
    let isDesktopReportActive = false;

    window.showToast = function(msg, icon = '✅') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    };

    window.openModal = function(id) {
      const m = document.getElementById(id);
      m.classList.remove('hidden');
      setTimeout(() => m.classList.remove('opacity-0'), 10);
    };

    window.closeModal = function(id) {
      const m = document.getElementById(id);
      m.classList.add('opacity-0');
      setTimeout(() => m.classList.add('hidden'), 200);
    };

    window.openReportModal = function() {
      if (window.innerWidth >= 768) {
        isDesktopReportActive = true;
        activeCarId = null;
        render();
        renderCarDetails(null);
      } else {
        openModal('modal-report');
        renderReport();
      }
    };

    window.switchReportTab = function(tab) {
      currentReportTab = tab;
      
      const btnParts = document.getElementById('report-tab-parts');
      const btnWorks = document.getElementById('report-tab-works');
      if (btnParts && btnWorks) {
        if (tab === 'parts') {
          btnParts.className = "flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow";
          btnWorks.className = "flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800/50";
        } else {
          btnWorks.className = "flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow";
          btnParts.className = "flex-1 py-2.5 px-4 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800/50";
        }
      }

      const deskBtnParts = document.getElementById('desk-report-tab-parts');
      const deskBtnWorks = document.getElementById('desk-report-tab-works');
      if (deskBtnParts && deskBtnWorks) {
        if (tab === 'parts') {
          deskBtnParts.className = "py-1.5 px-3 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow";
          deskBtnWorks.className = "py-1.5 px-3 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800";
        } else {
          deskBtnWorks.className = "py-1.5 px-3 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow";
          deskBtnParts.className = "py-1.5 px-3 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white bg-slate-800";
        }
      }

      renderReport();
    };

    function renderReport() {
      const mobContainer = document.getElementById('report-content');
      const deskContainer = document.getElementById('desk-report-body');
      
      const containers = [mobContainer, deskContainer].filter(Boolean);
      containers.forEach(c => c.innerHTML = '');

      let hasItems = false;

      containers.forEach(container => {
        if (currentReportTab === 'parts') {
          Object.entries(allOrders).forEach(([orderId, o]) => {
            if (!o.parts || o.parts.length === 0) return;
            hasItems = true;

            const carWrapper = document.createElement('div');
            carWrapper.className = "bg-slate-900/70 border border-slate-700/60 rounded-xl p-3 space-y-2";
            carWrapper.innerHTML = `<h4 class="font-bold text-sm text-blue-400 border-b border-slate-800 pb-1.5">🚗 ${o.car}</h4>`;

            const listDiv = document.createElement('div');
            listDiv.className = "space-y-2";

            o.parts.forEach((p, pIdx) => {
              const selectColor = p.status === 'issued' ? 'text-emerald-400' : p.status === 'ordered' ? 'text-amber-400' : 'text-slate-300';
              const itemEl = document.createElement('div');
              itemEl.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800";
              itemEl.innerHTML = `
                <span class="text-xs md:text-sm text-slate-200">📦 ${p.text}</span>
                <select class="part-select bg-slate-800 border border-slate-600 rounded p-1.5 text-xs font-semibold outline-none ${selectColor}">
                  <option value="none" ${p.status==='none'?'selected':''}>Очікує замовлення</option>
                  <option value="ordered" ${p.status==='ordered'?'selected':''}>🟡 Вже замовлено</option>
                  <option value="issued" ${p.status==='issued'?'selected':''}>🟢 Деталь видано</option>
                </select>
              `;

              itemEl.querySelector('select').addEventListener('change', (e) => {
                let updatedParts = [...allOrders[orderId].parts];
                updatedParts[pIdx].status = e.target.value;
                update(ref(db, 'orders/' + orderId), { parts: updatedParts }).then(() => showToast('Замовлення оновлено'));
              });

              listDiv.appendChild(itemEl);
            });

            carWrapper.appendChild(listDiv);
            container.appendChild(carWrapper);
          });

        } else {
          Object.entries(allOrders).forEach(([orderId, o]) => {
            if (!o.works || o.works.length === 0) return;
            hasItems = true;

            const carWrapper = document.createElement('div');
            carWrapper.className = "bg-slate-900/70 border border-slate-700/60 rounded-xl p-3 space-y-2";
            carWrapper.innerHTML = `<h4 class="font-bold text-sm text-blue-400 border-b border-slate-800 pb-1.5">🚗 ${o.car}</h4>`;

            const listDiv = document.createElement('div');
            listDiv.className = "space-y-2";

            o.works.forEach((w, wIdx) => {
              const itemEl = document.createElement('div');
              itemEl.className = "flex items-center justify-between gap-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800";
              itemEl.innerHTML = `
                <div class="flex items-center gap-2 text-xs md:text-sm">
                  <span>${w.done ? '✅' : '⏳'}</span>
                  <span class="${w.done ? 'text-slate-500 line-through' : 'text-slate-200'}">${w.text}</span>
                </div>
                <button class="text-xs px-3 py-1 rounded font-medium transition-colors ${w.done ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-emerald-600 text-white hover:bg-emerald-500'}">
                  ${w.done ? 'Повернути в роботу' : 'Виконано'}
                </button>
              `;

              itemEl.querySelector('button').addEventListener('click', () => {
                let updatedWorks = [...allOrders[orderId].works];
                updatedWorks[wIdx].done = !updatedWorks[wIdx].done;
                update(ref(db, 'orders/' + orderId), { works: updatedWorks }).then(() => {
                  showToast('Статус роботи змінено');
                  renderReport();
                });
              });

              listDiv.appendChild(itemEl);
            });

            carWrapper.appendChild(listDiv);
            container.appendChild(carWrapper);
          });
        }

        if (!hasItems) {
          container.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">Немає доданих ${currentReportTab === 'parts' ? 'запчастин' : 'робіт'} ні в одном авто.</div>`;
        }
      });
    }

    window.setFilter = function(filter) {
      currentFilter = filter;
      const filters = ['diag', 'work', 'done', 'all'];
      
      filters.forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = "py-1.5 rounded-lg transition-all flex flex-col items-center justify-center bg-blue-600 text-white shadow";
        } else {
          btn.className = "py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200";
        }
      });

      render();
    };

    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      allOrders = data ? data : {};
      render();
      if (!document.getElementById('modal-report').classList.contains('hidden') || isDesktopReportActive) {
        renderReport();
      }
      if (activeCarId && allOrders[activeCarId]) {
        renderCarDetails(activeCarId);
      }
    });

    function render() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const sidebarContainer = document.getElementById('sidebar-car-list');
      sidebarContainer.innerHTML = '';

      const counts = { diag: 0, work: 0, done: 0, all: 0 };
      const statusPriority = { diag: 1, work: 2, done: 3 };

      const sortedEntries = Object.entries(allOrders).sort((a, b) => {
        const pA = statusPriority[a[1].status] || 99;
        const pB = statusPriority[b[1].status] || 99;
        return pA - pB;
      });

      sortedEntries.forEach(([id, o]) => {
        if (!o.car) return;
        
        counts.all++;
        if (counts[o.status] !== undefined) counts[o.status]++;

        if (!o.car.toLowerCase().includes(searchQuery)) return;
        if (currentFilter !== 'all' && o.status !== currentFilter) return;

        const isSelected = activeCarId === id && !isDesktopReportActive;
        const card = document.createElement('div');
        
        let statusBadge = '';
        if (o.status === 'diag') statusBadge = '<span class="text-[10px] bg-amber-950 text-amber-400 px-1.5 py-0.5 rounded border border-amber-800/60">Черга</span>';
        if (o.status === 'work') statusBadge = '<span class="text-[10px] bg-blue-950 text-blue-400 px-1.5 py-0.5 rounded border border-blue-800/60">В роботі</span>';
        if (o.status === 'done') statusBadge = '<span class="text-[10px] bg-emerald-950 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-800/60">Готово</span>';

        card.className = `p-3 rounded-xl border transition-all flex justify-between items-center cursor-pointer group ${isSelected ? 'bg-blue-600/20 border-blue-500 shadow-md' : 'bg-slate-800/80 border-slate-700/80 hover:border-slate-500 hover:bg-slate-800'}`;
        
        card.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <span class="text-base shrink-0">🚗</span>
            <div class="truncate">
              <h4 class="font-bold text-slate-100 text-xs md:text-sm truncate">${o.car}</h4>
              <div class="flex items-center gap-1 mt-0.5">${statusBadge}</div>
            </div>
          </div>
          <button id="del-btn-${id}" class="text-slate-500 hover:text-red-400 transition-colors p-1 shrink-0 opacity-80 md:opacity-0 group-hover:opacity-100" title="Видалити авто">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest(`#del-btn-${id}`)) return;
          openCarDetails(id);
        });

        card.querySelector(`#del-btn-${id}`).addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Точно видалити авто?')) {
            if (activeCarId === id && window.innerWidth < 768) {
              closeModal('modal-car-details');
            }
            if (activeCarId === id) {
              activeCarId = null;
              isDesktopReportActive = false;
            }

            remove(ref(db, 'orders/' + id)).then(() => {
              showToast('Видалено');
              render();
              if (window.innerWidth >= 768) {
                renderCarDetails(null);
              }
            });
          }
        });

        sidebarContainer.appendChild(card);
      });

      if (sidebarContainer.children.length === 0) {
        sidebarContainer.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs">Немає авто для відображення</div>`;
      }

      document.getElementById('cnt-diag').innerText = counts.diag;
      document.getElementById('cnt-work').innerText = counts.work;
      document.getElementById('cnt-done').innerText = counts.done;
      document.getElementById('cnt-all').innerText = counts.all;
    }

    function openCarDetails(id) {
      activeCarId = id;
      isDesktopReportActive = false;
      render();
      renderCarDetails(id);
      
      if (window.innerWidth < 768) {
        openModal('modal-car-details');
      }
    }

    function renderCarDetails(id) {
      const emptyState = document.getElementById('desktop-empty-state');
      const carContent = document.getElementById('desktop-car-content');
      const reportContent = document.getElementById('desktop-report-content');

      if (isDesktopReportActive) {
        emptyState.classList.add('hidden');
        carContent.classList.add('hidden');
        carContent.classList.remove('flex');
        
        reportContent.classList.remove('hidden');
        reportContent.classList.add('flex');
        renderReport();
        return;
      }

      reportContent.classList.add('hidden');
      reportContent.classList.remove('flex');

      const o = allOrders[id];
      if (!o) {
        emptyState.classList.remove('hidden');
        carContent.classList.add('hidden');
        carContent.classList.remove('flex');
        return;
      }

      emptyState.classList.add('hidden');
      carContent.classList.remove('hidden');
      carContent.classList.add('flex');

      document.getElementById('desk-detail-car-title').innerText = `🚗 ${o.car}`;
      document.getElementById('desk-detail-car-header').onclick = () => {
        promptInput('Редагувати авто та номер', 'Напр. BMW X5 (AX 7777 AI)', v => {
          update(ref(db, 'orders/' + id), { car: v }).then(() => showToast('Авто оновлено'));
        }, o.car);
      };

      const deskStatusSel = document.getElementById('desk-detail-status-sel');
      deskStatusSel.value = o.status;
      deskStatusSel.onchange = (e) => {
        update(ref(db, 'orders/' + id), { status: e.target.value }).then(() => showToast('Статус змінено'));
      };

      document.getElementById('detail-car-title').innerText = `🚗 ${o.car}`;
      document.getElementById('detail-car-header').onclick = () => {
        promptInput('Редагувати авто та номер', 'Напр. BMW X5 (AX 7777 AI)', v => {
          update(ref(db, 'orders/' + id), { car: v }).then(() => showToast('Авто оновлено'));
        }, o.car);
      };

      const mobStatusSel = document.getElementById('detail-status-sel');
      mobStatusSel.value = o.status;
      mobStatusSel.onchange = (e) => {
        update(ref(db, 'orders/' + id), { status: e.target.value }).then(() => showToast('Статус змінено'));
      };

      const generateBodyHTML = (container) => {
        container.innerHTML = '';

        const compBlock = document.createElement('div');
        compBlock.className = "text-xs md:text-sm text-slate-300 bg-slate-950/40 p-3.5 rounded-xl border border-slate-700/50 border-l-4 border-l-blue-500 cursor-pointer hover:bg-slate-900 transition-colors flex justify-between items-start gap-2";
        compBlock.title = "Натисніть, щоб змінити скаргу";
        compBlock.innerHTML = `
          <span>💬 <span>${o.complaints || 'Без скарг (натисніть щоб додати)'}</span></span>
          <span class="text-[10px] text-slate-400 uppercase tracking-wider shrink-0 mt-0.5 font-bold">змінити</span>
        `;
        compBlock.addEventListener('click', () => {
          promptTextarea('Редагувати скаргу', o.complaints || '', v => {
            update(ref(db, 'orders/' + id), { complaints: v }).then(() => showToast('Скаргу оновлено'));
          });
        });
        container.appendChild(compBlock);

        const masterCommentBlock = document.createElement('div');
        masterCommentBlock.className = "text-xs md:text-sm text-amber-200/90 bg-amber-950/30 p-3.5 rounded-xl border border-amber-800/40 border-l-4 border-l-amber-500 space-y-1";
        masterCommentBlock.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold text-amber-400/80 uppercase tracking-wider">👷 Коментар майстра</span>
          </div>
          <p class="text-slate-200 leading-relaxed">${o.masterComment ? o.masterComment : '<span class="italic text-slate-500">Коментар відсутній</span>'}</p>
        `;
        container.appendChild(masterCommentBlock);

        const worksBlock = document.createElement('div');
        worksBlock.className = "space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60";
        
        let worksListHtml = (o.works || []).map((w) => `
          <div class="flex items-start gap-2 text-xs md:text-sm bg-slate-950/40 p-2.5 rounded-lg border border-slate-800">
            <span class="mt-0.5">${w.done ? '✅' : '⏳'}</span>
            <span class="${w.done ? 'text-slate-500 line-through' : 'text-slate-200'} leading-tight">${w.text}</span>
          </div>
        `).join('');

        worksBlock.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <h4 class="font-bold text-xs uppercase text-slate-400 tracking-wider">🛠️ Роботи</h4>
            <button id="add-work-btn" class="text-xs font-bold text-blue-400 hover:text-blue-300 bg-blue-500/10 border border-blue-500/20 px-2.5 py-1 rounded-lg transition-colors">+ Додати роботу</button>
          </div>
          ${worksListHtml ? `<div class="space-y-2">${worksListHtml}</div>` : '<p class="text-xs text-slate-500 italic">Роботи ще не додані</p>'}
        `;

        worksBlock.querySelector('#add-work-btn').addEventListener('click', () => {
          promptInput('Додати роботу', 'Заміна масла...', v => {
            let updatedWorks = [...(o.works || []), { text: v, done: false }];
            update(ref(db, 'orders/' + id), { works: updatedWorks }).then(() => showToast('Роботу додано'));
          });
        });
        container.appendChild(worksBlock);

        const partsBlock = document.createElement('div');
        partsBlock.className = "space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/60";

        partsBlock.innerHTML = `
          <div class="flex justify-between items-center mb-1">
            <h4 class="font-bold text-xs uppercase text-slate-400 tracking-wider">📦 Запчастини</h4>
            <button id="add-part-btn" class="text-xs font-bold text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg transition-colors">+ Замовити деталь</button>
          </div>
          <div id="parts-list-container" class="space-y-2"></div>
        `;

        const partsListContainer = partsBlock.querySelector('#parts-list-container');
        if (!o.parts || o.parts.length === 0) {
          partsListContainer.innerHTML = '<p class="text-xs text-slate-500 italic">Запчастини ще не додані</p>';
        } else {
          o.parts.forEach((p, idx) => {
            let selectColor = p.status === 'issued' ? 'text-emerald-400' : p.status === 'ordered' ? 'text-amber-400' : 'text-slate-400';
            const partEl = document.createElement('div');
            partEl.className = "flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800";
            partEl.innerHTML = `
              <span class="text-xs md:text-sm text-slate-200 leading-tight">📦 ${p.text}</span>
              <select id="part-sel-${idx}" class="bg-slate-800 border border-slate-600 rounded p-1.5 text-xs font-semibold outline-none ${selectColor}">
                <option value="none" ${p.status==='none'?'selected':''}>Очікує замовлення</option>
                <option value="ordered" ${p.status==='ordered'?'selected':''}>🟡 Вже замовлено</option>
                <option value="issued" ${p.status==='issued'?'selected':''}>🟢 Деталь видано</option>
              </select>
            `;

            partEl.querySelector('select').addEventListener('change', (e) => {
              let updatedParts = [...o.parts];
              updatedParts[idx].status = e.target.value;
              update(ref(db, 'orders/' + id), { parts: updatedParts }).then(() => showToast('Замовлення оновлено'));
            });

            partsListContainer.appendChild(partEl);
          });
        }

        partsBlock.querySelector('#add-part-btn').addEventListener('click', () => {
          promptInput('Замовити деталь', 'Фільтр салону', v => {
            let updatedParts = [...(o.parts || []), { text: v, status: 'none' }];
            update(ref(db, 'orders/' + id), { parts: updatedParts }).then(() => showToast('Деталь додано'));
          });
        });
        container.appendChild(partsBlock);
      };

      generateBodyHTML(document.getElementById('desk-detail-car-body'));
      generateBodyHTML(document.getElementById('detail-car-body'));
    }

    window.saveNewOrder = function() {
      const car = document.getElementById('in-car').value.trim();
      const cmp = document.getElementById('in-complaints').value.trim();
      if (!car) return showToast('Введіть марку авто!', '⚠️');
      
      push(ordersRef, { car, complaints: cmp, status: 'diag', works: [], parts: [] }).then((res) => {
        document.getElementById('in-car').value = ''; 
        document.getElementById('in-complaints').value = '';
        closeModal('modal-new-order');
        showToast('Авто прийнято');
        if (res.key) openCarDetails(res.key);
      });
    };

    function promptInput(title, placeholder, callback, initialValue = '') {
      document.getElementById('modal-input-title').innerText = title;
      const input = document.getElementById('modal-input-field');
      input.value = initialValue;
      input.placeholder = placeholder;
      currentAction = callback;
      openModal('modal-input');
      setTimeout(() => input.focus(), 100);
    }

    document.getElementById('modal-input-btn').addEventListener('click', () => {
      const val = document.getElementById('modal-input-field').value.trim();
      if (val && currentAction) { 
        currentAction(val); 
        closeModal('modal-input'); 
      }
    });

    function promptTextarea(title, initialValue, callback) {
      document.getElementById('modal-textarea-title').innerText = title;
      const input = document.getElementById('modal-textarea-field');
      input.value = initialValue;
      currentTextareaAction = callback;
      openModal('modal-textarea');
      setTimeout(() => input.focus(), 100);
    }

    document.getElementById('modal-textarea-btn').addEventListener('click', () => {
      const val = document.getElementById('modal-textarea-field').value.trim();
      if (currentTextareaAction) { 
        currentTextareaAction(val); 
        closeModal('modal-textarea'); 
      }
    });

    document.getElementById('searchInput').addEventListener('input', render);
  </script>
</body>
</html>
