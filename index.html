<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СТО Контроль — Приймальник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f1f5f9; user-select: none; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Шапка -->
  <header class="glass-panel border-b border-slate-700/50 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-2 rounded-lg text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </div>
      <h1 class="text-xl font-bold tracking-wide">СТО <span class="text-blue-500">PRO</span></h1>
    </div>
    <div class="flex items-center gap-4">
      <input type="text" id="searchInput" placeholder="Пошук авто..." class="hidden md:block bg-slate-800 border border-slate-700 rounded-lg px-4 py-1.5 text-sm outline-none focus:border-blue-500 transition-colors">
      <span class="px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">💻 Приймальник</span>
    </div>
  </header>

  <!-- Головна панель -->
  <main class="flex-1 p-4 lg:p-6 w-full max-w-screen-2xl mx-auto flex flex-col gap-6">
    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700 shadow-sm">
      <div>
        <h2 class="text-lg font-semibold">Управління ремонтом</h2>
        <p class="text-sm text-slate-400">Слідкуйте за статусами та замовляйте запчастини</p>
      </div>
      <button onclick="openModal('modal-new-order')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg shadow-blue-900/20 transition-all flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        Нове авто
      </button>
    </div>

    <!-- Канбан Дошка -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-[70vh]">
      <div class="flex flex-col rounded-2xl bg-slate-800/30 border border-slate-700/50 overflow-hidden">
        <div class="p-4 border-b border-slate-700/50 bg-slate-800/50 flex justify-between items-center">
          <h3 class="font-bold text-amber-400 flex items-center gap-2"><span class="text-xl">🔍</span> Діагностика</h3>
          <span id="cnt-diag" class="bg-slate-700 text-xs font-bold px-2.5 py-1 rounded-md text-slate-300">0</span>
        </div>
        <div id="col-diag" class="p-3 space-y-3 overflow-y-auto flex-1 scroll-hide"></div>
      </div>

      <div class="flex flex-col rounded-2xl bg-slate-800/30 border border-slate-700/50 overflow-hidden">
        <div class="p-4 border-b border-slate-700/50 bg-slate-800/50 flex justify-between items-center">
          <h3 class="font-bold text-blue-400 flex items-center gap-2"><span class="text-xl">⚙️</span> В роботі</h3>
          <span id="cnt-work" class="bg-slate-700 text-xs font-bold px-2.5 py-1 rounded-md text-slate-300">0</span>
        </div>
        <div id="col-work" class="p-3 space-y-3 overflow-y-auto flex-1 scroll-hide"></div>
      </div>

      <div class="flex flex-col rounded-2xl bg-slate-800/30 border border-slate-700/50 overflow-hidden">
        <div class="p-4 border-b border-slate-700/50 bg-slate-800/50 flex justify-between items-center">
          <h3 class="font-bold text-emerald-400 flex items-center gap-2"><span class="text-xl">✅</span> Готово</h3>
          <span id="cnt-done" class="bg-slate-700 text-xs font-bold px-2.5 py-1 rounded-md text-slate-300">0</span>
        </div>
        <div id="col-done" class="p-3 space-y-3 overflow-y-auto flex-1 scroll-hide"></div>
      </div>
    </div>
  </main>

  <!-- Модалка: Нове Авто -->
  <div id="modal-new-order" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform">
      <h3 class="text-xl font-bold mb-4">🚗 Прийом авто</h3>
      <div class="space-y-4">
        <div>
          <label class="text-sm text-slate-400 block mb-1.5">Авто та номер</label>
          <input id="in-car" type="text" placeholder="Напр. BMW X5 (AX 7777 AI)" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="text-sm text-slate-400 block mb-1.5">Скарги / Причина звернення</label>
          <textarea id="in-complaints" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 focus:border-blue-500 outline-none resize-none"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeModal('modal-new-order')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-medium">Скасувати</button>
        <button onclick="saveNewOrder()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-medium shadow-lg">Створити</button>
      </div>
    </div>
  </div>

  <!-- Універсальна Модалка для Вводу -->
  <div id="modal-input" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 id="modal-input-title" class="text-lg font-bold mb-4">Введіть дані</h3>
      <input id="modal-input-field" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 focus:border-blue-500 outline-none mb-6">
      <div class="flex gap-3">
        <button onclick="closeModal('modal-input')" class="flex-1 bg-slate-700 py-2.5 rounded-xl">Скасувати</button>
        <button id="modal-input-btn" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-white">Зберегти</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 pointer-events-none">
    <span id="toast-icon">✅</span>
    <span id="toast-msg" class="text-sm font-medium">Збережено</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3_i3S6lVNYqQMTdp9_CZGqCG6tteQVNg",
      authDomain: "taller-gigante.firebaseapp.com",
      databaseURL: "https://taller-gigante-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "taller-gigante",
      storageBucket: "taller-gigante.firebasestorage.app",
      messagingSenderId: "780999138565",
      appId: "1:780999138565:web:9e68715ae7a4564c1fab6c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ordersRef = ref(db, 'orders');

    let allOrders = {};
    let currentAction = null;

    function showToast(msg, icon = '✅') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').innerText = icon;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    window.openModal = function(id) {
      const m = document.getElementById(id);
      m.classList.remove('hidden');
      setTimeout(() => m.classList.remove('opacity-0'), 10);
    }
    window.closeModal = function(id) {
      const m = document.getElementById(id);
      m.classList.add('opacity-0');
      setTimeout(() => m.classList.add('hidden'), 200);
    }

    // Слухаємо базу даних в реальному часі
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val();
      allOrders = data ? data : {};
      render();
    });

    function render() {
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const cols = { diag: document.getElementById('col-diag'), work: document.getElementById('col-work'), done: document.getElementById('col-done') };
      const counts = { diag: 0, work: 0, done: 0 };

      Object.values(cols).forEach(c => c.innerHTML = '');

      Object.entries(allOrders).forEach(([id, o]) => {
        if (!o.car || !o.car.toLowerCase().includes(searchQuery)) return;

        const card = document.createElement('div');
        card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm hover:shadow-md transition-shadow flex flex-col gap-3 group";
        
        const works = (o.works || []).map((w) => `
          <div class="flex items-start gap-2 text-[13px] bg-slate-900/50 p-2 rounded-lg border border-slate-700/50">
            <span class="mt-0.5">${w.done ? '✅' : '⏳'}</span>
            <span class="${w.done ? 'text-slate-500 line-through' : 'text-slate-200'} leading-tight">${w.text}</span>
          </div>
        `).join('');

        const parts = (o.parts || []).map((p, idx) => {
          let selectColor = p.status === 'issued' ? 'text-emerald-400' : p.status === 'ordered' ? 'text-amber-400' : 'text-slate-400';
          return `
          <div class="flex flex-col gap-1.5 bg-slate-900 p-2.5 rounded-lg border border-slate-700/50">
            <span class="text-[13px] text-slate-200 leading-tight">📦 ${p.text}</span>
            <select id="part-sel-${id}-${idx}" class="bg-slate-800 border border-slate-600 rounded p-1.5 text-xs font-semibold outline-none ${selectColor}">
              <option value="none" ${p.status==='none'?'selected':''}>Очікує замовлення</option>
              <option value="ordered" ${p.status==='ordered'?'selected':''}>🟡 Вже замовлено</option>
              <option value="issued" ${p.status==='issued'?'selected':''}>🟢 Деталь видано</option>
            </select>
          </div>
        `}).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <h4 class="font-bold text-slate-100 text-[15px] leading-tight">${o.car}</h4>
            <button id="del-btn-${id}" class="text-slate-500 hover:text-red-400 transition-colors p-1 opacity-0 group-hover:opacity-100"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
          </div>
          
          ${o.complaints ? `<div class="text-[13px] text-slate-400 bg-slate-900/30 p-2 rounded border border-slate-700/30 border-l-2 border-l-blue-500">💬 ${o.complaints}</div>` : ''}
          
          ${works ? `<div class="space-y-1">${works}</div>` : ''}
          ${parts ? `<div class="space-y-2 mt-1 border-t border-slate-700/50 pt-2">${parts}</div>` : ''}

          <div class="mt-auto pt-3 border-t border-slate-700/50 flex justify-between items-center gap-2">
            <select id="status-sel-${id}" class="bg-slate-900 border border-slate-600 rounded-lg text-xs font-medium p-1.5 text-slate-200 outline-none focus:border-blue-500">
              <option value="diag" ${o.status==='diag'?'selected':''}>Діагностика</option>
              <option value="work" ${o.status==='work'?'selected':''}>В роботі</option>
              <option value="done" ${o.status==='done'?'selected':''}>Готово</option>
            </select>
            <div class="flex gap-2">
              <button id="add-work-${id}" class="text-[11px] font-bold uppercase text-slate-400 hover:text-blue-400 transition-colors bg-slate-700/50 px-2 py-1 rounded">+ Робота</button>
              <button id="add-part-${id}" class="text-[11px] font-bold uppercase text-slate-400 hover:text-emerald-400 transition-colors bg-slate-700/50 px-2 py-1 rounded">+ Деталь</button>
            </div>
          </div>
        `;

        // Прив'язка подій для елементів картки
        card.querySelector(`#del-btn-${id}`).addEventListener('click', () => {
          if(confirm('Точно видалити авто?')) {
            remove(ref(db, 'orders/' + id)).then(() => showToast('Видалено'));
          }
        });

        card.querySelector(`#status-sel-${id}`).addEventListener('change', (e) => {
          update(ref(db, 'orders/' + id), { status: e.target.value }).then(() => showToast('Статус змінено'));
        });

        (o.parts || []).forEach((_, idx) => {
          card.querySelector(`#part-sel-${id}-${idx}`).addEventListener('change', (e) => {
            let updatedParts = [...o.parts];
            updatedParts[idx].status = e.target.value;
            update(ref(db, 'orders/' + id), { parts: updatedParts }).then(() => showToast('Замовлення оновлено'));
          });
        });

        card.querySelector(`#add-work-${id}`).addEventListener('click', () => {
          promptInput('Додати роботу', 'Заміна масла...', v => {
            let updatedWorks = [...(o.works || []), { text: v, done: false }];
            update(ref(db, 'orders/' + id), { works: updatedWorks }).then(() => showToast('Роботу додано'));
          });
        });

        card.querySelector(`#add-part-${id}`).addEventListener('click', () => {
          promptInput('Замовити деталь', 'Фільтр салону', v => {
            let updatedParts = [...(o.parts || []), { text: v, status: 'none' }];
            update(ref(db, 'orders/' + id), { parts: updatedParts }).then(() => showToast('Деталь додано'));
          });
        });

        if (cols[o.status]) {
          cols[o.status].appendChild(card);
          counts[o.status]++;
        }
      });

      document.getElementById('cnt-diag').innerText = counts.diag;
      document.getElementById('cnt-work').innerText = counts.work;
      document.getElementById('cnt-done').innerText = counts.done;
    }

    window.saveNewOrder = function() {
      const car = document.getElementById('in-car').value.trim();
      const cmp = document.getElementById('in-complaints').value.trim();
      if (!car) return showToast('Введіть марку авто!', '⚠️');
      
      push(ordersRef, { car, complaints: cmp, status: 'diag', works: [], parts: [] }).then(() => {
        document.getElementById('in-car').value = ''; 
        document.getElementById('in-complaints').value = '';
        closeModal('modal-new-order');
        showToast('Авто прийнято');
      });
    }

    function promptInput(title, placeholder, callback) {
      document.getElementById('modal-input-title').innerText = title;
      const input = document.getElementById('modal-input-field');
      input.value = '';
      input.placeholder = placeholder;
      currentAction = callback;
      openModal('modal-input');
      setTimeout(() => input.focus(), 100);
    }

    document.getElementById('modal-input-btn').addEventListener('click', () => {
      const val = document.getElementById('modal-input-field').value.trim();
      if (val && currentAction) { 
        currentAction(val); 
        closeModal('modal-input'); 
      }
    });

    document.getElementById('searchInput').addEventListener('input', render);
  </script>
</body>
</html>
