<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>СТО Контроль — Гігант</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #0f172a; color: #f1f5f9; user-select: none; margin:0; }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  html, body { height: 100%; }
  #app-container { position: fixed; inset: 0; display: none; }
  #back-to-select { position: fixed; top: 10px; left: 10px; z-index: 100; display: none; }
</style>
</head>
<body>

  <!-- Екран вибору ролі -->
  <div id="role-select-screen" class="min-h-screen flex flex-col items-center justify-center p-6 gap-8">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-3 rounded-xl text-white">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2-4H8L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2m2 0a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0M5 11l1.5-4.5h11L19 11"></path>
        </svg>
      </div>
      <h1 class="text-2xl md:text-3xl font-bold tracking-wide">СТО <span class="text-blue-500">ГІГАНТ</span></h1>
    </div>
    <p class="text-sm md:text-base text-slate-400 -mt-4">Оберіть свій розділ</p>
    <div class="flex flex-col sm:flex-row gap-4 w-full max-w-2xl">
      <button id="btn-boss" class="flex-1 bg-slate-800/80 hover:bg-slate-800 border border-emerald-500/30 hover:border-emerald-500/60 rounded-2xl p-6 flex flex-col items-center gap-2 transition-all shadow-sm">
        <span class="text-3xl">💻</span>
        <span class="font-bold text-emerald-400 uppercase tracking-wider text-sm">Керівник</span>
      </button>
      <button id="btn-master1" class="flex-1 bg-slate-800/80 hover:bg-slate-800 border border-blue-500/30 hover:border-blue-500/60 rounded-2xl p-6 flex flex-col items-center gap-2 transition-all shadow-sm">
        <span class="text-3xl">🔧</span>
        <span class="font-bold text-blue-400 uppercase tracking-wider text-sm">СЮ</span>
      </button>
      <button id="btn-master2" class="flex-1 bg-slate-800/80 hover:bg-slate-800 border border-purple-500/30 hover:border-purple-500/60 rounded-2xl p-6 flex flex-col items-center gap-2 transition-all shadow-sm">
        <span class="text-3xl">🔧</span>
        <span class="font-bold text-purple-400 uppercase tracking-wider text-sm">ОЄ</span>
      </button>
    </div>
  </div>

  <button id="back-to-select" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-3 py-2 rounded-lg text-xs font-medium shadow-lg flex items-center gap-1.5">
    ⬅ Змінити роль
  </button>

  <div id="app-container"></div>

  <template id="tpl-boss">
  <!-- HEADER -->
  <header class="glass-panel border-b border-slate-700/50 p-3 md:p-4 sticky top-0 z-40 flex flex-col md:flex-row justify-between items-center gap-3 shadow-lg shrink-0">
    <div class="flex justify-between items-center w-full md:w-auto">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2-4H8L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2m2 0a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0M5 11l1.5-4.5h11L19 11"></path>
          </svg>
        </div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">СТО <span class="text-blue-500">ГІГАНТ</span></h1>
      </div>
      <span class="md:hidden px-2.5 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Керівник</span>
    </div>

    <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto overflow-x-auto scroll-hide">
      <input type="text" id="searchInput" placeholder="Пошук авто..." class="w-32 md:w-48 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 md:py-2 text-xs md:text-sm outline-none focus:border-blue-500 transition-colors shrink-0">
      
      <button onclick="openModal('modal-works-summary')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg font-medium text-xs flex items-center gap-1.5 whitespace-nowrap shrink-0 transition-colors">
        🛠️ <span class="hidden sm:inline">Поточні</span> роботи
      </button>

      <button onclick="openModal('modal-parts-summary')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg font-medium text-xs flex items-center gap-1.5 whitespace-nowrap shrink-0 transition-colors">
        📦 Запчастини
      </button>

      <button onclick="openModal('modal-expenses')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 px-2.5 py-1.5 md:px-3 md:py-2 rounded-lg font-medium text-xs flex items-center gap-1.5 whitespace-nowrap shrink-0 transition-colors">
        🛒 Госппотреби
      </button>

      <span class="hidden md:inline-block px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0">💻 Керівник</span>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main class="flex-1 p-3 md:p-6 w-full max-w-screen-2xl mx-auto flex flex-col md:flex-row gap-4 md:gap-6 min-h-0 overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-full md:w-80 lg:w-96 flex flex-col rounded-2xl bg-slate-900/60 border border-slate-800 overflow-hidden shrink-0 h-full">
      <div class="p-3 border-b border-slate-800 bg-slate-900/90 flex flex-col gap-3 shrink-0">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Автомобілі</span>
          <button onclick="openModal('modal-new-order')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl font-medium shadow transition-all flex items-center gap-1.5 text-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Нове авто
          </button>
        </div>

        <div class="grid grid-cols-4 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
          <button onclick="setFilter('diag')" id="filter-diag" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center bg-blue-600 text-white shadow" title="Черга">
            <span class="text-sm">🔍</span>
            <span class="text-[9px] font-bold leading-tight">Черга</span>
            <span id="cnt-diag" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('work')" id="filter-work" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="В роботі">
            <span class="text-sm">⚙️</span>
            <span class="text-[9px] font-bold leading-tight">В роботі</span>
            <span id="cnt-work" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('done')" id="filter-done" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="Готово">
            <span class="text-sm">✅</span>
            <span class="text-[9px] font-bold leading-tight">Готово</span>
            <span id="cnt-done" class="text-[9px] opacity-80">0</span>
          </button>
          <button onclick="setFilter('all')" id="filter-all" class="py-1.5 rounded-lg transition-all flex flex-col items-center justify-center text-slate-400 hover:text-slate-200" title="Усі авто">
            <span class="text-sm">🚘</span>
            <span class="text-[9px] font-bold leading-tight">Усі</span>
            <span id="cnt-all" class="text-[9px] opacity-80">0</span>
          </button>
        </div>
      </div>

      <div id="sidebar-car-list" class="p-3 pb-16 space-y-2.5 overflow-y-auto flex-1 scroll-hide"></div>
    </aside>

    <!-- DESKTOP DETAIL PANEL -->
    <section class="hidden md:flex flex-1 flex-col rounded-2xl bg-slate-900/40 border border-slate-800 overflow-hidden h-full">
      <div id="desktop-detail-container" class="h-full flex flex-col relative">
        <div id="desktop-empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-500 p-8 text-center space-y-3">
          <div class="text-5xl opacity-40">🚗</div>
          <p class="text-sm">Оберіть автомобіль із списку ліворуч для перегляду деталей.</p>
        </div>

        <div id="desktop-car-content" class="hidden h-full flex-col">
          <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
            <div id="desk-detail-car-header" class="flex items-center gap-2">
              <h3 id="desk-detail-car-title" class="text-xl font-bold text-slate-100">🚗 ...</h3>
              <button id="desk-edit-car-btn" class="text-slate-500 hover:text-blue-400 p-1 rounded transition-colors" title="Редагувати авто та номер">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </button>
            </div>
            
            <div class="flex items-center gap-3">
              <span class="text-xs text-slate-400">Статус:</span>
              <select id="desk-detail-status-sel" class="bg-slate-800 border border-slate-700 rounded-lg text-xs font-semibold p-2 text-slate-200 outline-none focus:border-blue-500">
                <option value="diag">🔍 Черга</option>
                <option value="work">⚙️ В роботі</option>
                <option value="done">✅ Готово</option>
              </select>
            </div>
          </div>
          <div class="p-6 overflow-y-auto space-y-5 scroll-hide flex-1" id="desk-detail-car-body"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: MOBILE CAR DETAILS -->
  <div id="modal-car-details" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 md:hidden opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <div id="detail-car-header" class="flex items-center gap-2">
          <h3 id="detail-car-title" class="text-lg font-bold text-slate-100">🚗 ...</h3>
          <button id="mob-edit-car-btn" class="text-slate-500 hover:text-blue-400 p-1 rounded transition-colors" title="Редагувати авто та номер">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          </button>
        </div>
        <button onclick="closeModal('modal-car-details')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 scroll-hide flex-1" id="detail-car-body"></div>

      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-between items-center">
        <select id="detail-status-sel" class="bg-slate-900 border border-slate-600 rounded-lg text-xs font-medium p-2 text-slate-200 outline-none focus:border-blue-500">
          <option value="diag">Черга</option>
          <option value="work">В роботі</option>
          <option value="done">Готово</option>
        </select>
        <button onclick="closeModal('modal-car-details')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <!-- MODAL: WORKS SUMMARY -->
  <div id="modal-works-summary" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-3xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <h3 class="text-lg font-bold flex items-center gap-2">🛠️ Поточні роботи по всіх авто</h3>
        <button onclick="closeModal('modal-works-summary')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div class="p-3 bg-slate-900/40 border-b border-slate-700/60 flex justify-end">
        <select id="summary-work-filter" onchange="renderWorksSummary()" class="w-full sm:w-auto bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold outline-none focus:border-blue-500 text-slate-200">
          <option value="all">Усі статуси</option>
          <option value="pending">⏳ В очікуванні</option>
          <option value="done">✅ Виконано</option>
        </select>
      </div>

      <div class="p-4 flex-1 overflow-y-auto scroll-hide space-y-3" id="works-summary-content"></div>
      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-end">
        <button onclick="closeModal('modal-works-summary')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <!-- MODAL: PARTS SUMMARY -->
  <div id="modal-parts-summary" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-3xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <h3 class="text-lg font-bold flex items-center gap-2">📦 Замовлені та потрібні запчастини</h3>
        <button onclick="closeModal('modal-parts-summary')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-3 bg-slate-900/40 border-b border-slate-700/60 flex justify-end">
        <select id="summary-part-filter" onchange="renderPartsSummary()" class="w-full sm:w-auto bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold outline-none focus:border-blue-500 text-slate-200">
          <option value="all">Усі статуси</option>
          <option value="none">⏳ Очікує замовлення</option>
          <option value="ordered">🟡 Вже замовлено</option>
          <option value="issued">🟢 Деталь видано</option>
        </select>
      </div>

      <div class="p-4 flex-1 overflow-y-auto scroll-hide space-y-3" id="parts-summary-content"></div>
      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-end">
        <button onclick="closeModal('modal-parts-summary')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EXPENSES (ГОСППОТРЕБИ) -->
  <div id="modal-expenses" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-2xl h-[85vh] flex flex-col shadow-2xl overflow-hidden transform scale-95 transition-transform">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
        <h3 class="text-lg font-bold flex items-center gap-2">🛒 Господарські потреби СТО</h3>
        <button onclick="closeModal('modal-expenses')" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-4 border-b border-slate-700/60 bg-slate-900/30">
        <div class="flex gap-2">
          <input id="in-expense-item" type="text" placeholder="Що потрібно купити? (напр. Мастило ВД-40, Рідке мило)..." class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-3.5 py-2.5 text-sm focus:border-blue-500 outline-none">
          <button onclick="addExpenseItem()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-colors shrink-0 shadow">
            + Додати
          </button>
        </div>
      </div>

      <div class="p-4 flex-1 overflow-y-auto scroll-hide space-y-2.5" id="expenses-list-container"></div>

      <div class="p-3 border-t border-slate-700 bg-slate-900/55 flex justify-end">
        <button onclick="closeModal('modal-expenses')" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-medium">Закрити</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NEW ORDER -->
  <div id="modal-new-order" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform">
      <h3 class="text-lg md:text-xl font-bold mb-4">🚗 Прийом авто</h3>
      <div class="space-y-4">
        <div>
          <label class="text-xs md:text-sm text-slate-400 block mb-1.5">Авто та номер</label>
          <input id="in-car" type="text" placeholder="Напр. BMW X5 (AX 7777 AI)" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none">
        </div>
        <div>
          <label class="text-xs md:text-sm text-slate-400 block mb-1.5">Скарги / Причина звернення</label>
          <textarea id="in-complaints" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none resize-none"></textarea>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeModal('modal-new-order')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-medium text-sm">Скасувати</button>
        <button onclick="saveNewOrder()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-medium shadow-lg text-sm">Створити</button>
      </div>
    </div>
  </div>

  <!-- MODAL: PROMPT INPUT -->
  <div id="modal-input" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 md:p-6 w-full max-w-sm shadow-2xl">
      <h3 id="modal-input-title" class="text-base md:text-lg font-bold mb-4">Введіть дані</h3>
      <input id="modal-input-field" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:border-blue-500 outline-none mb-3">
      <div id="modal-input-select-container" class="mb-6 hidden">
        <label class="text-xs text-slate-400 block mb-1">Призначити майстра:</label>
        <select id="modal-input-master-select" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-sm outline-none focus:border-blue-500">
          <option value="СЮ">👨‍🔧 СЮ</option>
          <option value="ОЄ">👨‍🔧 ОЄ</option>
        </select>
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal('modal-input')" class="flex-1 bg-slate-700 py-2.5 rounded-xl text-sm">Скасувати</button>
        <button id="modal-input-btn" class="flex-1 bg-blue-600 py-2.5 rounded-xl font-medium text-white text-sm">Зберегти</button>
      </div>
    </div>
  </div>

  <!-- MODAL: PROMPT TEXTAREA -->
  <div id="modal-textarea" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">

erSelect = false, initialMaster = 'СЮ') {\n      document.getElementById('modal-input-title').innerText = title;\n      const input = document.getElementById('modal-input-field');\n      const selectContainer = document.getElementById('modal-input-select-container');\n      const selectMaster = document.getElementById('modal-input-master-select');\n      \n      input.value = initialValue;\n      input.placeholder = placeholder;\n      \n      if (showMasterSelect) {\n        selectContainer.classList.remove('hidden');\n        selectMaster.value = initialMaster;\n      } else {\n        selectContainer.classList.add('hidden');\n      }\n\n      currentAction = callback;\n      openModal('modal-input');\n      setTimeout(() => input.focus(), 100);\n    }\n\n    document.getElementById('modal-input-btn').addEventListener('click', () => {\n      const val = document.getElementById('modal-input-field').value.trim();\n      const masterVal = document.getElementById('modal-input-master-select').value;\n      if (val && currentAction) { \n        currentAction(val, masterVal); \n        closeModal('modal-input'); \n      }\n    });\n\n    function promptTextarea(title, initialValue, callback) {\n      document.getElementById('modal-textarea-title').innerText = title;\n      const input = document.getElementById('modal-textarea-field');\n      input.value = initialValue;\n      currentTextareaAction = callback;\n      openModal('modal-textarea');\n      setTimeout(() => input.focus(), 100);\n    }\n\n    document.getElementById('modal-textarea-btn').addEventListener('click', () => {\n      const val = document.getElementById('modal-textarea-field').value.trim();\n      if (currentTextareaAction) { \n        currentTextareaAction(val); \n        closeModal('modal-textarea'); \n      }\n    });\n\n    document.getElementById('searchInput').addEventListener('input', render);\n  ",
      "master1": "\n    import { initializeApp } from \"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js\";\n    import { getDatabase, ref, push, update, remove, onValue } from \"https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js\";\n\n    const firebaseConfig = {\n      apiKey: \"AIzaSyD3_i3S6lVNYqQMTdp9_CZGqCG6tteQVNg\",\n      authDomain: \"taller-gigante.firebaseapp.com\",\n      databaseURL: \"https://taller-gigante-default-rtdb.europe-west1.firebasedatabase.app\",\n      projectId: \"taller-gigante\",\n      storageBucket: \"taller-gigante.firebasestorage.app\",\n      messagingSenderId: \"780999138565\",\n      appId: \"1:780999138565:web:9e68715ae7a4564c1fab6c\"\n    };\n\n    const CURRENT_MASTER_ID = \"СЮ\";\n\n    const app = initializeApp(firebaseConfig);\n    const db = getDatabase(app);\n    const ordersRef = ref(db, 'orders');\n    const expensesRef = ref(db, 'expenses');\n\n    let allOrders = {};\n    let allExpenses = {};\n    let currentAction = null;\n    let activeOrderId = null;\n\n    function showToast(msg, icon = '✅') {\n      const t = document.getElementById('toast');\n      document.getElementById('toast-msg').innerText = msg;\n      document.getElementById('toast-icon').innerText = icon;\n      t.classList.remove('translate-y-20', 'opacity-0');\n      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);\n    }\n\n    window.openModal = function(id) {\n      const m = document.getElementById(id);\n      m.classList.remove('hidden');\n      setTimeout(() => m.classList.remove('opacity-0'), 10);\n      if (id === 'modal-expenses') renderExpenses();\n    }\n\n    window.closeModal = function(id) {\n      const m = document.getElementById(id);\n      m.classList.add('opacity-0');\n      setTimeout(() => m.classList.add('hidden'), 200);\n    }\n\n    // --- EXPENSES LOGIC ---\n    window.addExpenseItem = function() {\n      const input = document.getElementById('in-expense-item');\n      const title = ex-col justify-between shadow-sm group\";\n        const badgeHtml = masterWorks.length > 0\n          ? `<span class=\"text-xs text-blue-400 bg-blue-950/60 border border-blue-800/50 px-2 py-0.5 rounded-md font-medium shrink-0\">${masterWorks.length} робіт</span>`\n          : `<span class=\"text-xs text-slate-400 bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-md font-medium shrink-0\">+ додати</span>`;\n        card.innerHTML = `\n          <div class=\"flex items-center justify-between gap-2\">\n            <div class=\"font-bold text-sm text-slate-100 group-hover:text-blue-400 transition-colors truncate\">🚗 ${order.car}</div>\n            ${badgeHtml}\n          </div>\n        `;\n\n        card.addEventListener('click', () => {\n          activeOrderId = id;\n          renderCarModal(id);\n          openModal('modal-car-details');\n        });\n\n        colWork.appendChild(card);\n      });\n\n      document.getElementById('cnt-work').innerText = workCount;\n\n      if (workCount === 0) {\n        colWork.innerHTML = `<div class=\"col-span-full text-center text-slate-500 py-12 text-sm\">Немає призначених авто в роботі</div>`;\n      }\n    }\n\n    function renderCarModal(id) {\n      const order = allOrders[id];\n      if (!order) return closeModal('modal-car-details');\n\n      const masterWorks = getMasterWorks(order);\n\n      document.getElementById('modal-car-title').innerText = `🚗 ${order.car}`;\n\n      const body = document.getElementById('modal-car-body');\n      body.innerHTML = '';\n\n      // Скарги\n      const compEl = document.createElement('div');\n      compEl.className = \"space-y-1.5 bg-slate-950/40 p-3 rounded-xl border border-slate-700/50 border-l-4 border-l-blue-500\";\n      const complaintsArray = Array.isArray(order.complaints) ? order.complaints : (order.complaints ? [{ text: order.complaints }] : []);\n      if (complaintsArray.length === 0) {\n        compEl.innerHTML = `<h4 class=\"font-bold text-xs uppercase text-blue-4 addEventListener('click', () => {\n              if (confirm('Видалити цей коментар?')) {\n                let updatedComments = [...commentsArray];\n                updatedComments.splice(idx, 1);\n                update(ref(db, `orders/${id}`), { masterComments: updatedComments }).then(() => showToast('Коментар видалено'));\n              }\n            });\n          }\n\n          commentsList.appendChild(commentEl);\n        });\n      }\n\n      commentsBlock.querySelector('#add-comment-btn').addEventListener('click', () => {\n        promptInput('Додати коментар', 'Введіть коментар...', text => {\n          let updatedComments = [...commentsArray, { text, author: CURRENT_MASTER_ID }];\n          update(ref(db, `orders/${id}`), { masterComments: updatedComments }).then(() => showToast('Коментар додано'));\n        });\n      });\n\n      body.appendChild(commentsBlock);\n\n      // Роботи\n      const worksBlock = document.createElement('div');\n      worksBlock.className = \"space-y-2 bg-slate-900/50 p-3.5 rounded-xl border border-slate-700/60\";\n      worksBlock.innerHTML = `\n        <div class=\"flex justify-between items-center mb-2\">\n          <h4 class=\"font-bold text-xs uppercase text-slate-400 tracking-wider\">🛠️ Мої роботи (${masterWorks.length})</h4>\n          <button id=\"add-work-btn\" class=\"text-xs font-bold text-blue-400 hover:text-blue-300 bg-blue-500/10 border border-blue-500/20 px-2.5 py-1 rounded-lg transition-colors\">+ Додати роботу</button>\n        </div>\n      `;\n\n      if (masterWorks.length === 0) {\n        const emptyEl = document.createElement('p');\n        emptyEl.className = \"text-xs text-slate-500 italic\";\n        emptyEl.innerText = 'Роботи ще не додані';\n        worksBlock.appendChild(emptyEl);\n      }\n\n      worksBlock.querySelector('#add-work-btn').addEventListener('click', () => {\n        promptInput('Додати роботу', 'Опис роботи...', text => {\n          const newWork = { text, done: false, assignedTo: C       "master2": "\n    import { initializeApp } from \"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js\";\n    import { getDatabase, ref, push, update, remove, onValue } from \"https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js\";\n\n    const firebaseConfig = {\n      apiKey: \"AIzaSyD3_i3S6lVNYqQMTdp9_CZGqCG6tteQVNg\",\n      authDomain: \"taller-gigante.firebaseapp.com\",\n      databaseURL: \"https://taller-gigante-default-rtdb.europe-west1.firebasedatabase.app\",\n      projectId: \"taller-gigante\",\n      storageBucket: \"taller-gigante.firebasestorage.app\",\n      messagingSenderId: \"780999138565\",\n      appId: \"1:780999138565:web:9e68715ae7a4564c1fab6c\"\n    };\n\n    const CURRENT_MASTER_ID = \"ОЄ\";\n\n    const app = initializeApp(firebaseConfig);\n    const db = getDatabase(app);\n    const ordersRef = ref(db, 'orders');\n    const expensesRef = ref(db, 'expenses');\n\n    let allOrders = {};\n    let allExpenses = {};\n    let currentAction = null;\n    let activeOrderId = null;\n\n    function showToast(msg, icon = '✅') {\n      const t = document.getElementById('toast');\n      document.getElementById('toast-msg').innerText = msg;\n      document.getElementById('toast-icon').innerText = icon;\n      t.classList.remove('translate-y-20', 'opacity-0');\n      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);\n    }\n\n    window.openModal = function(id) {\n      const m = document.getElementById(id);\n      m.classList.remove('hidden');\n      setTimeout(() => m.classList.remove('opacity-0'), 10);\n      if (id === 'modal-expenses') renderExpenses();\n    }\n\n    window.closeModal = function(id) {\n      const m = document.getElementById(id);\n      m.classList.add('opacity-0');\n      setTimeout(() => m.classList.add('hidden'), 200);\n    }\n\n    window.addExpenseItem = function() {\n      const input = document.getElementById('in-expense-item');\n      const title = input.value.trim();\n      if ( 5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\"></path></svg>\n          </button>\n        `;\n\n        itemEl.querySelector(`#toggle-exp-${id}`).addEventListener('click', () => {\n          update(ref(db, 'expenses/' + id), { bought: !exp.bought }).then(() => showToast(exp.bought ? 'Повернуто в список' : 'Куплено'));\n        });\n\n        itemEl.querySelector(`#del-exp-${id}`).addEventListener('click', () => {\n          remove(ref(db, 'expenses/' + id)).then(() => showToast('Видалено'));\n        });\n\n        container.appendChild(itemEl);\n      });\n    }\n\n    onValue(ordersRef, (snapshot) => {\n      allOrders = snapshot.val() || {};\n      render();\n      if (activeOrderId && allOrders[activeOrderId]) {\n        renderCarModal(activeOrderId);\n      }\n    });\n\n    onValue(expensesRef, (snapshot) => {\n      allExpenses = snapshot.val() || {};\n      if (!document.getElementById('modal-expenses').classList.contains('hidden')) renderExpenses();\n    });\n\n    function getMasterWorks(order) {\n      if (!order || !order.works) return [];\n      return order.works.filter(w => w.assignedTo === CURRENT_MASTER_ID);\n    }\n\n    function render() {\n      const colWork = document.getElementById('col-work');\n      const searchQuery = (document.getElementById('searchInput').value || '').toLowerCase();\n      colWork.innerHTML = '';\n      let workCount = 0;\n\n      Object.entries(allOrders).forEach(([id, order]) => {\n        if (order.status !== 'work') return;\n\n        const masterWorks = getMasterWorks(order);\n        if (order.completedBy && order.completedBy[CURRENT_MASTER_ID]) return;\n\n        if (searchQuery && !order.car.toLowerCase().includes(searchQuery)) return;\n\n        workCount++;\n\n        const card = document.createElement('div');\n        card.className = \"bg-slate-800/90 border border-slate-700/80 p-3.5 rounded-xl hover:border-blue-500/50 cursor-pointer transition-all flex flex-col justify-between shadow-sm group\"; h4><p class=\"text-xs text-slate-500 italic\">Скарги відсутні</p>`;\n      } else {\n        compEl.innerHTML = `<h4 class=\"font-bold text-xs uppercase text-blue-400 tracking-wider mb-1.5\">💬 Скарги</h4>` +\n          complaintsArray.map(c => `<div class=\"text-xs md:text-sm text-slate-200 flex items-start gap-1\"><span class=\"text-blue-400/80\">•</span><span>${c.text}</span></div>`).join('');\n      }\n      body.appendChild(compEl);\n\n      // Коментарі майстра\n      const commentsBlock = document.createElement('div');\n      commentsBlock.className = \"space-y-2.5 bg-amber-950/20 p-3.5 rounded-xl border border-amber-800/40 border-l-4 border-l-amber-500\";\n      commentsBlock.innerHTML = `\n        <div class=\"flex justify-between items-center\">\n          <h4 class=\"font-bold text-xs uppercase text-amber-400 tracking-wider\">👷 Мої коментарі</h4>\n          <button id=\"add-comment-btn\" class=\"text-xs font-bold text-amber-400 hover:text-amber-300 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-lg transition-colors\">+ Додати</button>\n        </div>\n        <div id=\"comments-list\" class=\"space-y-2\"></div>\n      `;\n\n      const commentsList = commentsBlock.querySelector('#comments-list');\n      let commentsArray = order.masterComments || [];\n      if (!order.masterComments && order.masterComment) {\n        commentsArray = [{ text: order.masterComment }];\n      }\n\n      if (commentsArray.length === 0) {\n        commentsList.innerHTML = '<p class=\"text-xs text-slate-500 italic\">Коментарі відсутні</p>';\n      } else {\n        commentsArray.forEach((c, idx) => {\n          const canEditComment = (c.author || '—') === CURRENT_MASTER_ID;\n          const commentEl = document.createElement('div');\n          commentEl.className = \"flex items-start justify-between gap-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/80\";\n          commentEl.innerHTML = `\n            <div class=\"text-xs md:text-sm text-slate-200 flex-1 leading-relaxed\">\n              <span class=\"text-amber-400/80 mr-1\">•</span>\n              <span>${c.text}</span>\n              <span class=\"text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 ml-1.5 align-middle\">👤 ${c.author || '—'}</span>\n            </div>\n            ${canEditComment ? `\n            <div class=\"flex items-center gap-1 shrink-0\">\n              <button class=\"edit-comment-btn text-slate-500 hover:text-purple-400 p-1 rounded transition-colors\" title=\"Редагувати\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z\"></path></svg>\n              </button>\n              <button class=\"del-comment-btn text-slate-500 hover:text-red-400 p-1 rounded transition-colors\" title=\"Видалити\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\"></path></svg>\n              </button>\n            </div>` : ''}\n          `;\n\n          if (canEditComment) {\n            commentEl.querySelector('.edit-comment-btn').addEventListener('click', () => {\n              promptInput('Редагувати коментар', 'Введіть коментар...', text => {\n                let updatedComments = [...commentsArray];\n                updatedComments[idx] = { ...updatedComments[idx], text };\n                update(ref(db, `orders/${id}`), { masterComments: updatedComments }).then(() => showToast('Коментар оновлено'));\n              }, c.text);\n            });\n\n            commentEl.querySelector('.del-comment-btn').addEventListener('click', () => {\n              if (confirm('Видалити цей коментар?')) {\n                let updatedComments = [...commentsArray];\n                updatedComments.splice(idx, 1);\n                update(ref(db, `orders/${id}`), { masterComments: updatedComments }).then(() => showToast('Коментар видалено'));\n              }\n            });\n          }\n\n          commentsList.appendChild(commentEl);\n        });\n      }\n\n      commentsBlock.querySelector('#add-comment-btn').addEventListener('click', () => {\n        promptInput('Додати коментар', 'Введіть коментар...', text => {\n          let updatedComments = [...commentsArray, { text, author: CURRENT_MASTER_ID }];\n          update(ref(db, `orders/${id}`), { masterComments: updatedComments }).then(() => showToast('Коментар додано'));\n        });\n      });\n\n      body.appendChild(commentsBlock);\n\n      // Роботи\n      const worksBlock = document.createElement('div');\n      worksBlock.className = \"space-y-2 bg-slate-900/50 p-3.5 rounded-xl border border-slate-700/60\";\n      worksBlock.innerHTML = `\n        <div class=\"flex justify-between items-center mb-2\">\n          <h4 class=\"font-bold text-xs uppercase text-slate-400 tracking-wider\">🛠️ Мої роботи (${masterWorks.length})</h4>\n          <button id=\"add-work-btn\" class=\"text-xs font-bold text-purple-400 hover:text-purple-300 bg-purple-500/10 border border-purple-500/20 px-2.5 py-1 rounded-lg transition-colors\">+ Додати роботу</button>\n        </div>\n      `;\n\n      if (masterWorks.length === 0) {\n        const emptyEl = document.createElement('p');\n        emptyEl.className = \"text-xs text-slate-500 italic\";\n        emptyEl.innerText = 'Роботи ще не додані';\n        worksBlock.appendChild(emptyEl);\n      }\n\n      worksBlock.querySelector('#add-work-btn').addEventListener('click', () => {\n        promptInput('Додати роботу', 'Опис роботи...', text => {\n          const newWork = { text, done: false, assignedTo: CURRENT_MASTER_ID, addedBy: CURRENT_MASTER_ID };\n          const updatedWorks = [...(order.works || []), newWork];\n          update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => {\n            showToast('Роботу додано');\n          });\n        });\n      });\n\n      masterWorks.forEach((w) => {\n        const originalIndex = order.works.findIndex(origW => origW === w || (origW.text === w.text && origW.assignedTo === w.assignedTo && origW.done === w.done));\n        const workAddedBy = w.addedBy || 'Керівник';\n        const canEditWork = workAddedBy === CURRENT_MASTER_ID;\n        const item = document.createElement('div');\n        item.className = \"flex items-center justify-between gap-2 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800\";\n        item.innerHTML = `\n          <div class=\"flex items-center gap-2 text-xs md:text-sm flex-1 flex-wrap\">\n            <input type=\"checkbox\" ${w.done ? 'checked' : ''} class=\"w-4 h-4 rounded accent-emerald-500 cursor-pointer\">\n            <span class=\"${w.done ? 'line-through text-slate-500' : 'text-slate-200'} leading-tight\">${w.text}</span>\n            <span class=\"text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700\">👤 ${workAddedBy}</span>\n          </div>\n          <div class=\"flex items-center gap-1 shrink-0\">\n            ${canEditWork ? `\n            <button class=\"edit-work-btn text-slate-500 hover:text-purple-400 p-1 rounded transition-colors\" title=\"Редагувати роботу\">\n              <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z\"></path></svg>\n            </button>\n            <button class=\"del-work-btn text-slate-500 hover:text-red-400 p-1 rounded transition-colors\" title=\"Видалити роботу\">\n              <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\"></path></svg>\n            </button>` : ''}\n          </div>\n        `;\n\n        item.querySelector('input').addEventListener('change', (e) => {\n          if (originalIndex !== -1) {\n            let updatedWorks = [...order.works];\n            updatedWorks[originalIndex].done = e.target.checked;\n            update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => showToast('Статус оновлено'));\n          }\n        });\n\n        if (canEditWork) {\n          item.querySelector('.edit-work-btn').addEventListener('click', () => {\n            promptInput('Редагувати роботу', 'Опис роботи...', text => {\n              if (originalIndex !== -1) {\n                let updatedWorks = [...order.works];\n                updatedWorks[originalIndex] = { ...updatedWorks[originalIndex], text };\n                update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => showToast('Роботу оновлено'));\n              }\n            }, w.text);\n          });\n\n          item.querySelector('.del-work-btn').addEventListener('click', () => {\n            if (confirm('Видалити цю роботу?')) {\n              if (originalIndex !== -1) {\n                let updatedWorks = [...order.works];\n                updatedWorks.splice(originalIndex, 1);\n                update(ref(db, `orders/${id}`), { works: updatedWorks }).then(() => showToast('Роботу видалено'));\n              }\n            }\n          });\n        }\n\n        worksBlock.appendChild(item);\n      });\n      body.appendChild(worksBlock);\n\n      // Запчастини\n      const partsBlock = document.createElement('div');\n      partsBlock.className = \"space-y-2 bg-slate-900/50 p-3.5 rounded-xl border border-slate-700/60\";\n      partsBlock.innerHTML = `\n        <div class=\"flex justify-between items-center mb-2\">\n          <h4 class=\"font-bold text-xs uppercase text-slate-400 tracking-wider\">📦 Запчастини</h4>\n          <button id=\"add-part-btn\" class=\"text-xs font-bold text-emerald-400 hover:text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg transition-colors\">+ Додати</button>\n        </div>\n        <div id=\"parts-list\" class=\"space-y-2\"></div>\n      `;\n\n      const partsList = partsBlock.querySelector('#parts-list');\n      let partsArray = order.parts || [];\n\n      if (partsArray.length === 0) {\n        partsList.innerHTML = '<p class=\"text-xs text-slate-500 italic\">Запчастини ще не додані</p>';\n      } else {\n        partsArray.forEach((p, idx) => {\n          const statusLabel = p.status === 'issued' ? '🟢 Видано' : p.status === 'ordered' ? '🟡 Замовлено' : '⏳ Очікує замовлення';\n          const statusColor = p.status === 'issued' ? 'text-emerald-400 bg-emerald-950/40 border-emerald-800/50' : p.status === 'ordered' ? 'text-amber-400 bg-amber-950/40 border-amber-800/50' : 'text-slate-400 bg-slate-800 border-slate-700';\n          const canDelete = (p.addedBy || 'Керівник') === CURRENT_MASTER_ID;\n          const pEl = document.createElement('div');\n          pEl.className = \"flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800\";\n          pEl.innerHTML = `\n            <div class=\"flex items-center gap-2 text-xs md:text-sm text-slate-200 flex-1 flex-wrap\">\n              <span>📦</span>\n              <span class=\"leading-tight\">${p.text}</span>\n              <span class=\"text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700\">👤 ${p.addedBy || 'Керівник'}</span>\n            </div>\n            <div class=\"flex items-center gap-2 shrink-0 justify-between sm:justify-end\">\n              <span class=\"text-[10px] px-2 py-1 rounded font-semibold border ${statusColor}\" title=\"Статус може змінити лише керівник\">${statusLabel}</span>\n              ${canDelete ? `\n              <button class=\"edit-part-btn text-slate-500 hover:text-purple-400 p-1 rounded transition-colors\" title=\"Редагувати запчастину\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z\"></path></svg>\n              </button>\n              <button class=\"del-part-btn text-slate-500 hover:text-red-400 p-1 rounded transition-colors\" title=\"Видалити запчастину\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\"></path></svg>\n              </button>` : ''}\n            </div>\n          `;\n\n          if (canDelete) {\n            pEl.querySelector('.edit-part-btn').addEventListener('click', () => {\n              promptInput('Редагувати запчастину', 'Напр. Фільтр салону', text => {\n                let updatedParts = [...partsArray];\n                updatedParts[idx] = { ...updatedParts[idx], text };\n                update(ref(db, `orders/${id}`), { parts: updatedParts }).then(() => showToast('Деталь оновлено'));\n              }, p.text);\n            });\n\n            pEl.querySelector('.del-part-btn').addEventListener('click', () => {\n              if (confirm('Видалити цю запчастину?')) {\n                let updatedParts = [...partsArray];\n                updatedParts.splice(idx, 1);\n                update(ref(db, `orders/${id}`), { parts: updatedParts }).then(() => showToast('Деталь видалено'));\n              }\n            });\n          }\n\n          partsList.appendChild(pEl);\n        });\n      }\n\n      partsBlock.querySelector('#add-part-btn').addEventListener('click', () => {\n        promptInput('Замовити деталь', 'Напр. Фільтр салону', text => {\n          let updatedParts = [...partsArray, { text, status: 'none', addedBy: CURRENT_MASTER_ID }];\n          update(ref(db, `orders/${id}`), { parts: updatedParts }).then(() => showToast('Деталь додано'));\n        });\n      });\n\n      body.appendChild(partsBlock);\n\n      // Витратні матеріали\n      const materialsBlock = document.createElement('div');\n      materialsBlock.className = \"space-y-2.5 bg-teal-950/20 p-3.5 rounded-xl border border-teal-800/40 border-l-4 border-l-teal-500\";\n      materialsBlock.innerHTML = `\n        <div class=\"flex justify-between items-center\">\n          <h4 class=\"font-bold text-xs uppercase text-teal-400 tracking-wider\">🧴 Витратні матеріали</h4>\n          <button id=\"add-material-btn\" class=\"text-xs font-bold text-teal-400 hover:text-teal-300 bg-teal-500/10 border border-teal-500/20 px-2.5 py-1 rounded-lg transition-colors\">+ Додати</button>\n        </div>\n        <div id=\"materials-list\" class=\"space-y-2\"></div>\n      `;\n\n      const materialsList = materialsBlock.querySelector('#materials-list');\n      let materialsArray = order.materials || [];\n\n      if (materialsArray.length === 0) {\n        materialsList.innerHTML = '<p class=\"text-xs text-slate-500 italic\">Матеріали ще не додані</p>';\n      } else {\n        materialsArray.forEach((m, idx) => {\n          const canEditMaterial = (m.addedBy || '—') === CURRENT_MASTER_ID;\n          const mEl = document.createElement('div');\n          mEl.className = \"flex items-start justify-between gap-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/80\";\n          mEl.innerHTML = `\n            <div class=\"text-xs md:text-sm text-slate-200 flex-1 leading-relaxed\">\n              <span class=\"text-teal-400/80 mr-1\">•</span>\n              <span>${m.text}</span>\n              <span class=\"text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 ml-1.5 align-middle\">👤 ${m.addedBy || '—'}</span>\n            </div>\n            ${canEditMaterial ? `\n            <div class=\"flex items-center gap-1 shrink-0\">\n              <button class=\"edit-material-btn text-slate-500 hover:text-purple-400 p-1 rounded transition-colors\" title=\"Редагувати\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z\"></path></svg>\n              </button>\n              <button class=\"del-material-btn text-slate-500 hover:text-red-400 p-1 rounded transition-colors\" title=\"Видалити\">\n                <svg class=\"w-3.5 h-3.5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16\"></path></svg>\n              </button>\n            </div>` : ''}\n          `;\n\n          if (canEditMaterial) {\n            mEl.querySelector('.edit-material-btn').addEventListener('click', () => {\n              promptInput('Редагувати матеріал', 'Напр. Мастило 5W-30, 1л', text => {\n                let updatedMaterials = [...materialsArray];\n                updatedMaterials[idx] = { ...updatedMaterials[idx], text };\n                update(ref(db, `orders/${id}`), { materials: updatedMaterials }).then(() => showToast('Матеріал оновлено'));\n              }, m.text);\n            });\n\n            mEl.querySelector('.del-material-btn').addEventListener('click', () => {\n              if (confirm('Видалити цей матеріал?')) {\n                let updatedMaterials = [...materialsArray];\n                updatedMaterials.splice(idx, 1);\n                update(ref(db, `orders/${id}`), { materials: updatedMaterials }).then(() => showToast('Матеріал видалено'));\n              }\n            });\n          }\n\n          materialsList.appendChild(mEl);\n        });\n      }\n\n      materialsBlock.querySelector('#add-material-btn').addEventListener('click', () => {\n        promptInput('Додати матеріал', 'Напр. Мастило 5W-30, 1л', text => {\n          let updatedMaterials = [...materialsArray, { text, addedBy: CURRENT_MASTER_ID }];\n          update(ref(db, `orders/${id}`), { materials: updatedMaterials }).then(() => showToast('Матеріал додано'));\n        });\n      });\n\n      body.appendChild(materialsBlock);\n\n      const btnDone = document.getElementById('modal-btn-done');\n      if (masterWorks.length === 0) {\n        btnDone.classList.add('hidden');\n      } else {\n        btnDone.classList.remove('hidden');\n        btnDone.onclick = () => {\n          document.getElementById('modal-confirm-text').innerText = `Позначити ваші роботи по ${order.car} як виконані?`;\n          openModal('modal-confirm');\n          document.getElementById('modal-confirm-btn').onclick = () => {\n            let updatedWorks = [...order.works];\n            masterWorks.forEach(w => {\n              const wIdx = updatedWorks.findIndex(origW => origW === w || (origW.text === w.text && origW.assignedTo === w.assignedTo && origW.done === w.done));\n              if (wIdx !== -1) updatedWorks[wIdx] = { ...updatedWorks[wIdx], done: true };\n            });\n            const completedBy = { ...(order.completedBy || {}), [CURRENT_MASTER_ID]: true };\n            const allMastersDone = ['СЮ', 'ОЄ'].every(m => completedBy[m]);\n            const dbUpdates = { works: updatedWorks, completedBy };\n            if (allMastersDone) dbUpdates.status = 'done';\n            update(ref(db, `orders/${id}`), dbUpdates).then(() => {\n              closeModal('modal-confirm');\n              closeModal('modal-car-details');\n              showToast(allMastersDone ? 'Авто позначено як готове!' : 'Ваші роботи позначено як виконані!');\n            });\n          };\n        };\n      }\n    }\n\n    function promptInput(title, placeholder, callback, initialValue = '') {\n      document.getElementById('modal-input-title').innerText = title;\n      const input = document.getElementById('modal-input-field');\n      input.value = initialValue;\n      input.placeholder = placeholder;\n      currentAction = callback;\n      openModal('modal-input');\n      setTimeout(() => input.focus(), 100);\n    }\n\n    document.getElementById('modal-input-btn').addEventListener('click', () => {\n      const val = document.getElementById('modal-input-field').value.trim();\n      if (val && currentAction) {\n        currentAction(val);\n        closeModal('modal-input');\n      }\n    });\n\n    document.getElementById('searchInput').addEventListener('input', render);\n  "
};

    const BODY_CLASSES = {"boss": "h-screen flex flex-col font-sans overflow-hidden", "master1": "min-h-screen flex flex-col font-sans", "master2": "min-h-screen flex flex-col font-sans"};

    const screen = document.getElementById('role-select-screen');
    const container = document.getElementById('app-container');
    const backBtn = document.getElementById('back-to-select');

    function openApp(key) {
      const tpl = document.getElementById('tpl-' + key);
      container.innerHTML = '';
      container.className = BODY_CLASSES[key] + ' scroll-hide';
      container.style.overflowY = 'auto';
      container.appendChild(tpl.content.cloneNode(true));

      const scriptEl = document.createElement('script');
      scriptEl.type = 'module';
      scriptEl.textContent = MODULE_SCRIPTS[key];
      container.appendChild(scriptEl);

      screen.style.display = 'none';
      container.style.display = 'flex';
      backBtn.style.display = 'flex';
    }

    document.getElementById('btn-boss').addEventListener('click', () => openApp('boss'));
    document.getElementById('btn-master1').addEventListener('click', () => openApp('master1'));
    document.getElementById('btn-master2').addEventListener('click', () => openApp('master2'));
    backBtn.addEventListener('click', () => location.reload());
  </script>
</body>
</html>
